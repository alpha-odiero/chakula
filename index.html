<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Pikawise — discover meals, explore recipes using ingredients you have, and follow clear cooking instructions with offline access." />
    <meta name="theme-color" content="#198a43" />
    <meta name="application-name" content="Pikawise" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pikawise" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pikawise — Discover meals. Cook with what you have." />
    <meta property="og:description" content="Discover meals, explore recipes using ingredients you have, and follow clear cooking instructions with Pikawise." />
    <meta property="og:site_name" content="Pikawise" />
    <meta property="og:url" content="https://pikawise.vercel.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pikawise — Discover meals. Cook with what you have." />
    <meta name="twitter:description" content="Discover meals, explore recipes using ingredients you have, and follow clear cooking instructions with Pikawise." />
    <link rel="canonical" href="https://pikawise.vercel.app" />
    <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1" />
    <meta name="google-site-verification" content="Qb5fvAevj_gqHvjdykTMA47MyFueviCSqU1SmmBWbGM" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Pikawise",
        "url": "https://pikawise.vercel.app",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Android, iOS, Windows, macOS",
        "softwareVersion": "1.1",
        "description": "Discover meals, explore recipes using ingredients you have, and follow clear cooking instructions with offline access.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <script>
      ;(function () {
        try {
          var pref = JSON.parse(localStorage.getItem('chakula_theme') || '"light"')
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.add(dark ? 'theme-dark' : 'theme-light')
        } catch (e) {
          document.documentElement.classList.add('theme-light')
        }
      })()
    </script>
    <style>
      html {
        background: #f7f8f5;
      }
      html.theme-dark {
        background: #0f1310;
      }
      /* Pre-React Pikawise splash. Shown instantly on launch (web and
         installed app) and removed by the app once it is ready. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
        background: radial-gradient(120% 90% at 50% 15%, #ffffff 0%, #f3f8f2 52%, #e7f4ea 100%);
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      .pw-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .pw-splash-badge {
        --ring-w: 3.5px;
        position: relative;
        display: grid;
        place-items: center;
        width: 76px;
        height: 76px;
        animation: pw-splash-pop 0.6s cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }
      .pw-splash-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          from 0turn,
          rgba(25, 138, 67, 1) 0turn 0.4turn,
          rgba(25, 138, 67, 0) 0.4turn 0.5turn,
          rgba(25, 138, 67, 0.34) 0.5turn 0.9turn,
          rgba(25, 138, 67, 0) 0.9turn 1turn
        );
        -webkit-mask: radial-gradient(
          farthest-side,
          #0000 calc(100% - var(--ring-w)),
          #000 calc(100% - var(--ring-w))
        );
        mask: radial-gradient(
          farthest-side,
          #0000 calc(100% - var(--ring-w)),
          #000 calc(100% - var(--ring-w))
        );
        animation: pw-splash-spin 0.85s linear infinite;
      }
      .pw-splash-ring--inner {
        --ring-w: 2px;
        inset: 10px;
        background: conic-gradient(
          from 0.5turn,
          rgba(25, 138, 67, 0.55) 0turn 0.35turn,
          rgba(25, 138, 67, 0) 0.35turn 0.5turn,
          rgba(25, 138, 67, 0.55) 0.5turn 0.85turn,
          rgba(25, 138, 67, 0) 0.85turn 1turn
        );
        animation: pw-splash-spin 1.35s linear infinite reverse;
      }
      .pw-splash-mark {
        position: relative;
        width: 44px;
        height: 44px;
        border-radius: 13px;
        box-shadow: 0 8px 20px rgba(25, 138, 67, 0.24);
      }
      .pw-splash-name {
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-weight: 800;
        font-size: 24px;
        letter-spacing: -0.03em;
        color: #0f1310;
        animation: pw-splash-pop 0.7s cubic-bezier(0.2, 0.7, 0.3, 1) 0.05s both;
      }
      html.theme-dark #app-splash {
        background: radial-gradient(120% 90% at 50% 15%, #151b16 0%, #11170f 55%, #0f1310 100%);
      }
      html.theme-dark .pw-splash-name {
        color: #eef2ec;
      }
      html.theme-dark .pw-splash-mark {
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
      }
      #app-splash.pw-splash--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @keyframes pw-splash-pop {
        from {
          opacity: 0;
          transform: scale(0.88) translateY(8px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      @keyframes pw-splash-spin {
        to {
          transform: rotate(1turn);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pw-splash-badge,
        .pw-splash-ring,
        .pw-splash-name {
          animation: none;
        }
      }
    </style>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Pikawise — Discover meals. Cook with what you have.</title>
  </head>
  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-label="Pikawise is loading">
      <div class="pw-splash-inner">
        <span class="pw-splash-badge">
          <span class="pw-splash-ring" aria-hidden="true"></span>
          <span class="pw-splash-ring pw-splash-ring--inner" aria-hidden="true"></span>
          <img
            class="pw-splash-mark"
            src="./src/assets/logo.svg"
            alt=""
            width="44"
            height="44"
            aria-hidden="true"
          />
        </span>
        <span class="pw-splash-name">Pikawise</span>
      </div>
    </div>
    <script>
      /* Safety net: never leave the splash on screen forever if the app
         bundle fails to start. Removed normally by the React shell. */
      ;(function () {
        var splash = document.getElementById('app-splash')
        if (!splash) return
        window.setTimeout(function () {
          if (!splash.isConnected || splash.classList.contains('pw-splash--hidden')) return
          splash.classList.add('pw-splash--hidden')
          window.setTimeout(function () {
            if (splash.isConnected) splash.remove()
          }, 600)
        }, 8000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
