    <script>
      ;(function () {
        try {
          var pref = JSON.parse(localStorage.getItem('chakula_theme') || '"light"')
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.add(dark ? 'theme-dark' : 'theme-light')
          var prefs = JSON.parse(localStorage.getItem('chakula_preferences') || '{}')
          if (prefs && prefs.reduceMotion) document.documentElement.classList.add('reduce-motion')
        } catch (e) {
          document.documentElement.classList.add('theme-light')
        }
        // Apply the saved interface language before React mounts so the very
        // first paint already has the right lang/dir (Arabic starts RTL).
        try {
          var RTL = { ar: 1 }
          var LOCALE_ATTR = {
            en: 'en',
            sw: 'sw',
            fr: 'fr',
            es: 'es',
            ar: 'ar',
            pt: 'pt',
            hi: 'hi',
            'zh-CN': 'zh-CN'
          }
          var rawLocale = localStorage.getItem('chakula_locale')
          var locale = rawLocale ? JSON.parse(rawLocale) : null;
          if (!locale && typeof navigator !== 'undefined') {
            var cand = ((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();
            if (cand === 'zh' || cand.indexOf('zh-cn') === 0 || cand.indexOf('zh-hans') === 0) locale = 'zh-CN';
            else {
              var supp = ['sw', 'fr', 'es', 'ar', 'pt', 'hi', 'en'];
              for (var i = 0; i < supp.length; i++) {
                if (cand === supp[i] || cand.indexOf(supp[i] + '-') === 0) { locale = supp[i]; break; }
              }
            }
          }
          if (typeof locale === 'string' && LOCALE_ATTR[locale]) {
            document.documentElement.lang = LOCALE_ATTR[locale]
            document.documentElement.dir = RTL[locale] ? 'rtl' : 'ltr'
          }
        } catch (e) {
          /* keep the document defaults */
        }
      })()
    </script>
    <style>
      html {
        background: #ffffff;
      }
      html.theme-dark {
        background: #0a0a0a;
      }
      /* Pre-React Pikawise splash. Shown instantly on launch (web and
         installed app) and removed once the first page has rendered.
         Deliberately wordmark-free: no large logo or app icon. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
        background: #ffffff;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      .pw-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .pw-splash-name {
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-weight: 800;
        font-size: 24px;
        letter-spacing: -0.03em;
        color: #000000;
        animation: pw-splash-pop 0.7s cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }
      .pw-splash-dots {
        display: inline-flex;
        align-items: flex-end;
        gap: 7px;
        height: 14px;
      }
      .pw-splash-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #000000;
        opacity: 0.45;
        animation: pw-splash-dot 2.5s ease-in-out infinite;
      }
      .pw-splash-dots span:nth-child(1) {
        animation-delay: 0s;
      }
      .pw-splash-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .pw-splash-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      .pw-splash-dots span:nth-child(4) {
        animation-delay: 0.6s;
      }
      html.theme-dark #app-splash {
        background: #0a0a0a;
      }
      html.theme-dark .pw-splash-name {
        color: #fafafa;
      }
      html.theme-dark .pw-splash-dots span {
        filter: brightness(0) invert(1);
      }
      #app-splash.pw-splash--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @keyframes pw-splash-pop {
        from {
          opacity: 0;
          transform: scale(0.88) translateY(8px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      @keyframes pw-splash-dot {
        0%,
        100% {
          transform: translateY(0);
          opacity: 0.45;
        }
        35% {
          transform: translateY(-10px);
          opacity: 1;
        }
        70% {
          transform: translateY(0);
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pw-splash-name,
        .pw-splash-dots span {
          animation: none;
        }
      }
      .reduce-motion .pw-splash-name,
      .reduce-motion .pw-splash-dots span {
        animation: none;
      }
    </style>

    <div id="app-splash" role="status" aria-live="polite" aria-label="Pikawise is loading">
      <div class="pw-splash-inner">
        <span class="pw-splash-name">Pikawise</span>
        <span class="pw-splash-dots" aria-hidden="true"
          ><span></span><span></span><span></span><span></span
        ></span>
      </div>
    </div>
    <script>
      /* Safety net: never leave the splash on screen forever if the app
         bundle fails to start. Removed normally by the React shell. */
      ;(function () {
        var splash = document.getElementById('app-splash')
        if (!splash) return
        // Localised loading label: set before React boots so screen readers
        // announce the splash in the user's language.
        try {
          var LOADING_LABEL = {
            en: 'Pikawise is loading',
            sw: 'Pikawise inapakia',
            fr: 'Pikawise se charge',
            es: 'Pikawise se está cargando',
            ar: 'جارٍ تحميل Pikawise',
            pt: 'Pikawise está carregando',
            hi: 'Pikawise लोड हो रहा है',
            'zh-CN': 'Pikawise 正在加载'
          }
          var rawLocale = localStorage.getItem('chakula_locale')
          var locale = rawLocale ? JSON.parse(rawLocale) : null
          if (typeof locale === 'string' && LOADING_LABEL[locale]) {
            splash.setAttribute('aria-label', LOADING_LABEL[locale])
          }
        } catch (e) {
          /* keep the default label */
        }
        window.setTimeout(function () {
          if (!splash.isConnected || splash.classList.contains('pw-splash--hidden')) return
          splash.classList.add('pw-splash--hidden')
          window.setTimeout(function () {
            if (splash.isConnected) splash.remove()
          }, 600)
        }, 8000)
      })()
    </script>
